name: Feature / task
description: Work item to implement with /implement-issue
labels: ["enhancement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should exist when this is done, and why.
    validations:
      required: true
  - type: input
    id: requirements
    attributes:
      label: PRD requirement IDs
      placeholder: FR-VIS-007, NFR-PERF-003
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable checklist. Each item should be verifiable by a test or command.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Out of scope / constraints
  - type: textarea
    id: notes
    attributes:
      label: Notes and references
