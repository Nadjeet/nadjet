version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule: { interval: monthly }
    commit-message: { prefix: ci }
  - package-ecosystem: uv
    directory: /
    target-branch: dev
    schedule: { interval: monthly }
    commit-message: { prefix: build }
    groups:
      python: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule: { interval: monthly }
    commit-message: { prefix: build }
    groups:
      javascript: { patterns: ["*"] }
