name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint, types, contracts, tests)
    runs-on: ubuntu-latest
    services:
      db:
        image: imresamu/postgis:17-3.5
        env:
          POSTGRES_USER: nadjet
          POSTGRES_PASSWORD: nadjet
          POSTGRES_DB: nadjet
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U nadjet -d nadjet" --health-interval 2s --health-retries 30
      redis:
        image: redis:8-alpine
        ports: ["56379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-retries 30
    env:
      NADJET_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Contracts are up to date
        run: |
          uv run nadjet-export-schemas --check
          uv run nadjet-api export-openapi --check
      - name: Single Alembic head
        run: bash scripts/check-migrations.sh
      - name: Migrations
        working-directory: services/api
        run: uv run alembic upgrade head
      - name: Simulated cameras (MediaMTX control API for camsim integration tests)
        # Not `make infra-video`: it creates .env from .env.example, which tests must not read.
        run: |
          mkdir -p data/videos
          uv run nadjet-camsim render
          docker compose -f deploy/local/compose.yml --profile video up -d --wait mediamtx

      - name: OSRM from the committed test extract (routing integration tests)
        env:
          OSRM_IMAGE: ghcr.io/project-osrm/osrm-backend:v6.0.0
        run: |
          # Outside the repo: root-owned graph files would break `uv build` below.
          data="$RUNNER_TEMP/osrm"
          mkdir -p "$data"
          cp services/api/tests/data/boumerdes.osm.pbf "$data/"
          osrm() { docker run --rm -v "$data:/data" "$OSRM_IMAGE" "$@"; }
          osrm osrm-extract -p /opt/car.lua /data/boumerdes.osm.pbf
          osrm osrm-partition /data/boumerdes.osrm
          osrm osrm-customize /data/boumerdes.osrm
          docker run -d --name osrm -p 55000:5000 -v "$data:/data:ro" "$OSRM_IMAGE" \
            osrm-routed --algorithm mld /data/boumerdes.osrm
          for _ in $(seq 30); do
            curl -fs "http://localhost:55000/nearest/v1/driving/3.47,36.76" >/dev/null && exit 0
            sleep 1
          done
          docker logs osrm
          exit 1
      - name: Tests (unit + integration, no Brev)
        run: uv run pytest -m "not brev" --cov --cov-report=term --cov-report=xml
      - run: uv build --all-packages --out-dir dist

  web:
    name: Web (lint, types, client, build — no frontend tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated API client is up to date
        run: |
          pnpm gen:client
          git diff --exit-code -- packages/api-client/src/schema.d.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm build

  rules:
    name: Repository rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Integrity (no fabricated AI, Brev-only inference, no frontend tests)
        run: bash scripts/check-integrity.sh
      - name: One-line Conventional Commits without co-authors
        if: github.event_name == 'pull_request'
        run: |
          status=0
          for sha in $(git rev-list --no-merges "origin/${{ github.base_ref }}..HEAD"); do
            git log -1 --format=%B "$sha" > /tmp/msg
            python3 .githooks/commit-msg /tmp/msg || { echo "::error::commit $sha"; status=1; }
          done
          exit $status

  vision-image:
    name: Vision image (build and publish to GHCR)
    # Only on pushes to dev/main: pull requests (including forks) never get packages: write.
    if: github.event_name == 'push'
    # Never publish an image from a commit whose tests fail.
    needs: [python]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space (torch + CUDA layers need well over the default ~14 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nadjeet/nadjet-vision
          tags: |
            type=sha,format=long
            type=ref,event=branch
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/vision/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # mode=min: exporting every multi-GB layer would evict the other jobs' caches (10 GB).
          cache-to: type=gha,mode=min
