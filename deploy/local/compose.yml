# Local development infrastructure. Used by `make infra`, `make dev` and `make test`.
# Host ports avoid common defaults (5432, 6379) so they do not clash with other local projects.
name: nadjet

services:
  db:
    image: imresamu/postgis:17-3.5 # multi-arch (amd64 + arm64) build of the PostGIS image
    environment:
      POSTGRES_USER: nadjet
      POSTGRES_PASSWORD: nadjet
      POSTGRES_DB: nadjet
    ports: ["${NADJET_PG_PORT:-55432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nadjet -d nadjet"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["${NADJET_REDIS_PORT:-56379}:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  mediamtx:
    image: bluenviron/mediamtx:1.21.2-ffmpeg
    volumes:
      - ./mediamtx.generated.yml:/mediamtx.yml:ro
      - ../../data/videos:/videos:ro
    ports:
      - "8554:8554" # RTSP (vision workers)
      - "8889:8889" # WebRTC WHEP/WHIP signalling (browser)
      - "8189:8189/udp" # WebRTC media
      - "8189:8189/tcp" # WebRTC TCP fallback
      - "8888:8888" # LL-HLS fallback
      - "9997:9997" # control API
    profiles: [video]

  # --- SMS gateway (TD-13): capcom6 private server. Start with `make infra-sms`. ---
  sms-db:
    image: mariadb:11.4 # the gateway server needs MySQL/MariaDB, not PostgreSQL
    environment:
      MARIADB_ROOT_PASSWORD: ${NADJET_SMS_DB_PASSWORD:-nadjet-sms-dev}
      MARIADB_DATABASE: smsgate
    volumes: [smsdata:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 30
    profiles: [sms]

  sms-server:
    image: ghcr.io/android-sms-gateway/server:1.34.2
    configs: [{ source: sms_config, target: /app/config.yml }]
    ports: ["${NADJET_SMS_PORT:-3000}:3000"]
    depends_on:
      sms-db: { condition: service_healthy }
    profiles: [sms]

  sms-worker:
    image: ghcr.io/android-sms-gateway/server:1.34.2
    command: ["/app/app", "worker"]
    configs: [{ source: sms_config, target: /app/config.yml }]
    depends_on:
      sms-db: { condition: service_healthy }
    profiles: [sms]

  # Road routing (FR-DSP-001, TD-10). Needs `make routing-data` once; start with `make routing-up`.
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0 # multi-arch (amd64 + arm64)
    command:
      ["osrm-routed", "--algorithm", "mld", "--max-table-size", "100", "/data/algeria-latest.osrm"]
    ports: ["127.0.0.1:${NADJET_OSRM_PORT:-55000}:5000"]
    volumes: [osrmdata:/data:ro]
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:5000/nearest/v1/driving/3.47,36.76",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    profiles: [routing]

  # One-shot data preparation, driven by scripts/routing-data.sh.
  osrm-prepare:
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    volumes:
      - osrmdata:/data
      - ../../data/map/algeria-latest.osm.pbf:/data/algeria-latest.osm.pbf:ro
    profiles: [routing-prepare]

configs:
  sms_config:
    content: |
      gateway:
        mode: private
        private_token: ${NADJET_SMS_PRIVATE_TOKEN:-change-me}
      http:
        listen: 0.0.0.0:3000
      database:
        host: sms-db
        port: 3306
        user: root
        password: ${NADJET_SMS_DB_PASSWORD:-nadjet-sms-dev}
        database: smsgate
        timezone: UTC

volumes:
  pgdata: {}
  redisdata: {}
  smsdata: {}
  osrmdata: {}
