[project]
name = "nadjet-api"
version = "0.1.0"
description = "Nadjet coordination API: incidents, dispatch, notifications, real-time updates"
requires-python = ">=3.12,<3.13"
dependencies = [
  "nadjet-shared",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "redis>=5.2",
  "argon2-cffi>=23.1",
  "pyjwt>=2.10",
  "pyyaml>=6.0",
  "pynacl>=1.5",
  "python-multipart>=0.0.20",
  "arq>=0.28.0",
  "pywebpush>=2.5.0",
  "httpx>=0.28.1",
]

[project.scripts]
nadjet-api = "nadjet_api.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nadjet_api"]
