[project]
name = "nadjet-vision"
version = "0.1.0"
description = "Nadjet vision workers: detection, tracking, triggers, AI sweep and verification (inference on NVIDIA Brev only)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "nadjet-shared",
  "httpx>=0.28",
  "pydantic-settings>=2.6",
  "numpy>=2.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Heavy runtime deps for the GPU worker image on Brev (not needed for local dev or tests).
# torch/torchvision are listed so the root pins them to CUDA 12.6 wheels on Linux (TD-50).
gpu = [
  "rfdetr>=1.3",
  "supervision>=0.25",
  "trackers>=2.6",
  "av>=14",
  "torch>=2.6",
  "torchvision>=0.21",
]

[project.scripts]
nadjet-vision = "nadjet_vision.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nadjet_vision"]
